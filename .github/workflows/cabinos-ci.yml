name: CabinOS CI

on:
  push:
    branches:
      - "cabinos/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep one Windows build per branch; newer commits supersede older queued or running builds.
  group: cabinos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build checks
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install desktop CLI and UI dependencies
        run: npm ci

      - name: Install locked UI dependencies
        run: npm ci --prefix ui

      - name: Run UI tests
        run: npm test --prefix ui

      - name: Build UI
        run: npm run build --prefix ui

      - name: Build native CabinOS resources
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/build-release.ps1 -SkipUi

      - name: Run Rust workspace tests
        run: cargo test --workspace --locked

      - name: Check Rust workspace
        run: cargo check --workspace --locked

      - name: Build CabinOS desktop and native release components
        run: npm run build

      - name: Upload CabinOS Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: CabinOS-Windows-Installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
